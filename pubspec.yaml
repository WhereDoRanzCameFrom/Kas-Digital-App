name: kas_digitar_85
description: Aplikasi pencatatan keuangan KKN kelompok 85
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  provider: ^6.1.2
  fl_chart: ^0.68.0
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  pdf: ^3.11.0
  excel: ^4.0.3
  path_provider: ^2.1.3
  share_plus: ^13.1.0
  uuid: ^4.4.0
  permission_handler: ^11.3.1
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/kkn.jpeg
    - assets/images/icon.png
